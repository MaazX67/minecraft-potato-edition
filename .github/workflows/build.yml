name: Build

on:
  push:
  workflow_dispatch:

jobs:
  msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (MSVC x64)
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Run headless selftest
        run: .\build\Release\PotatoSelfTest.exe

      - name: Upload game artifact
        uses: actions/upload-artifact@v4
        with:
          name: PotatoEdition-exe
          path: build/Release/PotatoEdition.exe
          if-no-files-found: error